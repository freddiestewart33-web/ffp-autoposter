<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Final Frame Prints — Posting Dashboard</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d;
    --txt:#e6edf3; --dim:#8b949e; --accent:#e8b339; --ok:#3fb950; --warn:#d29922;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  header{padding:28px 24px 18px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:21px;letter-spacing:-.2px}
  .sub{color:var(--dim);font-size:13px;margin-top:5px}
  main{max-width:1080px;margin:0 auto;padding:22px 24px 60px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:26px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px 17px}
  .stat .n{font-size:26px;font-weight:600;letter-spacing:-.5px}
  .stat .l{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
     margin:30px 0 12px;font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:16px 18px;margin-bottom:11px}
  .next{border-color:var(--accent)}
  .next .tag{display:inline-block;background:var(--accent);color:#000;font-size:10px;
       font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.06em;margin-bottom:9px}
  .title{font-weight:600;margin-bottom:3px}
  .meta{color:var(--dim);font-size:12.5px}
  .caption{white-space:pre-wrap;font-size:13.5px;color:#c9d1d9;margin-top:10px;
           padding-top:10px;border-top:1px solid var(--line);max-height:150px;overflow:auto}
  .tags{margin-top:8px;font-size:12px;color:#58a6ff;word-break:break-word}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
  .pill{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);
        color:var(--dim);white-space:nowrap}
  .pill.shop{color:var(--accent);border-color:var(--accent)}
  .pill.eng{color:var(--ok);border-color:var(--ok)}
  .thumbs{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
  .thumbs img{width:62px;height:62px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase;
     letter-spacing:.06em;padding:7px 10px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  .never{color:var(--warn)}
  .err{background:#3d1d1d;border:1px solid #6e2b2b;padding:13px 16px;border-radius:9px;
       color:#ffa7a7;font-size:13.5px;margin-bottom:16px}
  a{color:#58a6ff;text-decoration:none} a:hover{text-decoration:underline}
  .loading{color:var(--dim);padding:24px 0}
  footer{color:var(--dim);font-size:12px;margin-top:34px;padding-top:16px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>Final Frame Prints — Posting Dashboard</h1>
  <div class="sub">Live from the automation repo. Posts daily at 18:00 UTC.</div>
</header>

<main>
  <div id="err"></div>
  <div class="grid" id="stats"><div class="loading">Loading…</div></div>

  <h2>Next in rotation</h2>
  <div id="next"><div class="loading">Loading…</div></div>

  <h2>Recent posts</h2>
  <div id="history"><div class="loading">Loading…</div></div>

  <h2>Full rotation</h2>
  <div class="card" style="padding:4px 0"><table id="rotation">
    <tr><td class="loading" style="padding-left:18px">Loading…</td></tr>
  </table></div>

  <footer id="foot"></footer>
</main>

<script>
const SHOP = "https://finalframeprints.com";
const LOG  = "../ffp-autoposter/post_log.jsonl";
const EXCLUDE = /size[_\-]?chart|sizechart/i;

const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const when = ts => { const d=new Date(ts); return isNaN(d)?ts:
  d.toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); };
const ago = ts => { const d=(Date.now()-new Date(ts))/86400000;
  return d<1?"today":d<2?"yesterday":Math.floor(d)+" days ago"; };

function err(msg){ document.getElementById("err").innerHTML +=
  `<div class="err">${esc(msg)}</div>`; }

async function getLog(){
  try{
    const r = await fetch(LOG,{cache:"no-store"});
    if(!r.ok) return [];
    return r.text().then(t => t.split("\n").filter(l=>l.trim())
      .map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(Boolean));
  }catch(e){ return []; }
}

async function getProducts(){
  try{
    const r = await fetch(`${SHOP}/products.json?limit=250`,{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    return d.products.map(p=>({
      title:p.title.trim(), handle:p.handle,
      url:`${SHOP}/products/${p.handle}`,
      price:(p.variants[0]||{}).price,
      images:p.images.filter(i=>!EXCLUDE.test(i.src)&&i.width>=900).map(i=>i.src)
    })).filter(p=>p.images.length);
  }catch(e){
    err("Couldn't load the Shopify catalogue (browser blocked the request). Post history below still works.");
    return [];
  }
}

function historyOrder(log){
  const seen=[]; log.forEach(e=>{ const h=e.product_handle; if(!h)return;
    const i=seen.indexOf(h); if(i>-1) seen.splice(i,1); seen.push(h); });
  return seen;
}

function render(products, log){
  const order = historyOrder(log);
  const posted = new Set(order);
  const rank = p => { const i=order.indexOf(p.handle); return i===-1?-1:i; };
  const sorted = [...products].sort((a,b)=>rank(a)-rank(b));

  const last = log[log.length-1];
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="n">${products.length||"—"}</div><div class="l">Products live</div></div>
    <div class="stat"><div class="n">${log.length}</div><div class="l">Posts published</div></div>
    <div class="stat"><div class="n">${products.length?products.filter(p=>!posted.has(p.handle)).length:"—"}</div><div class="l">Never posted</div></div>
    <div class="stat"><div class="n">${last?ago(last.ts):"—"}</div><div class="l">Last post</div></div>`;

  const next = sorted[0];
  document.getElementById("next").innerHTML = next ? `
    <div class="card next">
      <div class="tag">UP NEXT</div>
      <div class="title">${esc(next.title)}</div>
      <div class="meta">£${esc(next.price)} · <a href="${next.url}" target="_blank">product page</a>
        · ${posted.has(next.handle)?"posted before":"never posted"}</div>
      <div class="thumbs">${next.images.slice(0,3).map(s=>`<img src="${s}" alt="">`).join("")}</div>
    </div>` : `<div class="card"><div class="meta">Catalogue unavailable.</div></div>`;

  const h = document.getElementById("history");
  h.innerHTML = log.length ? [...log].reverse().slice(0,12).map(e=>{
    const ok = (e.results||[]).filter(r=>String(r[1]).startsWith("posted")).map(r=>r[0]);
    const mode = e.cta_mode==="shop"?'<span class="pill shop">shop link</span>'
                : e.cta_mode?'<span class="pill eng">engagement</span>':"";
    return `<div class="card">
      <div class="row">
        <div><div class="title">${esc(e.product_title||"(unknown product)")}</div>
        <div class="meta">${when(e.ts)} · ${ok.length?esc(ok.join(", ")):"nothing published"}</div></div>
        <div>${mode}</div>
      </div>
      ${e.caption?`<div class="caption">${esc(e.caption)}</div>`:""}
      ${(e.hashtags||[]).length?`<div class="tags">${e.hashtags.map(t=>"#"+esc(t)).join(" ")}</div>`:""}
    </div>`;
  }).join("") : `<div class="card"><div class="meta">No posts logged yet. The log fills up after the first live run.</div></div>`;

  const t = document.getElementById("rotation");
  t.innerHTML = products.length ? `<tr><th>#</th><th>Product</th><th>Price</th><th>Last posted</th></tr>` +
    sorted.map((p,i)=>{
      const idx = order.indexOf(p.handle);
      const lastPost = idx===-1 ? '<span class="never">never</span>'
        : (log.filter(e=>e.product_handle===p.handle).pop()||{}).ts;
      return `<tr><td>${i+1}</td>
        <td><a href="${p.url}" target="_blank">${esc(p.title)}</a></td>
        <td>£${esc(p.price)}</td>
        <td>${idx===-1?lastPost:when(lastPost)}</td></tr>`;
    }).join("") : `<tr><td class="meta" style="padding-left:18px">Catalogue unavailable.</td></tr>`;

  document.getElementById("foot").textContent =
    `Refreshed ${new Date().toLocaleString("en-GB")} · rotation picks the least-recently-posted product`;
}

(async()=>{
  const [products, log] = await Promise.all([getProducts(), getLog()]);
  render(products, log);
})();
</script>
</body>
</html>

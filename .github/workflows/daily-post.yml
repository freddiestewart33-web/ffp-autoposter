name: Daily Poster
on:
  schedule:
    # 06:00 UTC daily — 7am UK time (BST).
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      handle:
        description: "Force a specific product (Shopify handle). Blank = next in rotation."
        required: false
        default: ""
      dry_run:
        description: "Set to 'true' to generate everything but NOT publish"
        required: false
        default: "false"
      platforms:
        description: "Platforms to post to"
        required: false
        default: "instagram,facebook,pinterest,tiktok"
concurrency:
  group: daily-poster
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r ffp-autoposter/requirements.txt
      - name: Build config.json from secrets
        run: |
          cat > ffp-autoposter/config.json << 'EOF'
          {
            "meta": {
              "app_id": "${{ secrets.META_APP_ID }}",
              "app_secret": "${{ secrets.META_APP_SECRET }}",
              "system_user_token": "${{ secrets.META_SYSTEM_USER_TOKEN }}",
              "page_id": "${{ secrets.META_PAGE_ID }}",
              "ig_business_account_id": "${{ secrets.META_IG_ID }}"
            },
            "brand": {
              "shop_url": "https://finalframeprints.com",
              "handle": "@finalframeprints101"
            },
            "research": { "competitors": [] },
            "pinterest": { "access_token": "PENDING_TRIAL_APPROVAL", "board_id": "" },
            "tiktok": { "access_token": "PENDING_AUDIT", "open_id": "" },
            "gemini": {
              "api_key": "${{ secrets.GEMINI_API_KEY }}",
              "model": "gemini-flash-latest"
            }
          }
          EOF
      - name: Run daily post
        env:
          HANDLE: ${{ github.event.inputs.handle }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          PLATFORMS: ${{ github.event.inputs.platforms }}
        run: |
          cd ffp-autoposter
          ARGS=""
          [ -n "$HANDLE" ] && ARGS="$ARGS --handle $HANDLE"
          [ "$DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          [ -n "$PLATFORMS" ] && ARGS="$ARGS --platforms $PLATFORMS"
          python3 run_daily.py $ARGS
      - name: Save learned data back to repo
        if: always()
        run: |
          cd ffp-autoposter
          rm -f config.json
          rm -rf __pycache__
          cd ..
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "ffp-bot"
            git config user.email "bot@users.noreply.github.com"
            git add ffp-autoposter/post_log.jsonl 2>/dev/null || true
            git add ffp-autoposter/hashtag_library.json 2>/dev/null || true
            git add ffp-autoposter/swipe_brief.json 2>/dev/null || true
            git add ffp-autoposter/content-queue 2>/dev/null || true
            git commit -m "bot: post log + research data" || true
            git push || true
          fi
